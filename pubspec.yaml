name: route_monitor
description: "Aplicativo de campo do sistema de monitoramento de rotas da PU/UFCG"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: 3.12.2
  flutter: 3.44.6

dependencies:
  camera: 0.12.2
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  cryptography: 2.9.0
  dio: 5.11.0
  drift: 2.34.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_image_compress: 2.5.1
  flutter_local_notifications: 22.3.0
  flutter_map: 7.0.2
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 11.0.0
  geolocator: 14.0.3
  go_router: 18.0.0
  latlong2: 0.9.1
  mobile_scanner: 7.4.0
  permission_handler: 13.0.1
  # Promoted from transitive: the offline map wires the PMTiles archive and the
  # MapLibre style by hand (see lib/routing/campus_map.dart) and imports both
  # packages directly. Versions pinned to what vector_map_tiles_pmtiles 1.5.0
  # already locks.
  pmtiles: 1.3.0
  sqlite3_flutter_libs: 0.6.0+eol
  # Promoted from transitive: the silence warning schedules its local
  # notification with `zonedSchedule`, which takes a `TZDateTime`
  # (lib/monitoring/local_notification_scheduler.dart). Pinned to what
  # flutter_local_notifications 22.3.0 already locks.
  timezone: 0.11.1
  uuid: 4.6.0
  vector_map_tiles: 8.0.0
  vector_map_tiles_pmtiles: 1.5.0
  vector_tile_renderer: 5.2.1

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  # Pinned to the version flutter_test already locks; drives the next-batch
  # periodic retry on fake time.
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  # Declares this repo has an integration suite (test/integration/). The
  # suite itself does NOT import package:integration_test — see
  # test/integration/offline_route_test.dart for why (that binding forces
  # `flutter test` onto a device).
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/campus.pmtiles
    - assets/campus-style.json
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: BowlbyOneSC
      fonts:
        - asset: assets/fonts/BowlbyOneSC-Regular.ttf
