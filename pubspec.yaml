name: route_monitor
description: "Aplicativo de campo do sistema de monitoramento de rotas da PU/UFCG"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: 3.12.2
  flutter: 3.44.6

dependencies:
  cryptography: 2.9.0
  dio: 5.11.0
  flutter:
    sdk: flutter
  flutter_map: 7.0.2
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 11.0.0
  geolocator: 14.0.3
  go_router: 18.0.0
  latlong2: 0.9.1
  mobile_scanner: 7.4.0
  permission_handler: 13.0.1
  uuid: 4.6.0
  vector_map_tiles: 8.0.0
  vector_map_tiles_pmtiles: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/campus.pmtiles
    - assets/campus-style.json
    - assets/glyphs/
    - assets/glyphs/Noto Sans Regular/
